[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nurse-report-sheet-cli"
version = "0.1.0"
description = "Local-first CLI for nurses to build shift report sheets (patient summary, tasks, vitals) exported to Markdown/PDF."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Asdale Dynamics, LLC" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "reportlab>=4.0",
]

[project.scripts]
nurse-report = "nurse_report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nurse_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
